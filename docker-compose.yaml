services:
  postgres:
    image: postgres:16-alpine
    container_name: circle-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-circle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-circle}
      POSTGRES_DB: ${POSTGRES_DB:-circle}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-circle} -d ${POSTGRES_DB:-circle}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: circle-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CIRCLE_HTTP_ADDR: ":3001"
      CIRCLE_DATABASE_URL: postgresql://${POSTGRES_USER:-circle}:${POSTGRES_PASSWORD:-circle}@postgres:5432/${POSTGRES_DB:-circle}?sslmode=disable
      CIRCLE_PUBLIC_URL: ${CIRCLE_PUBLIC_URL:-http://localhost:3001}
      CIRCLE_WEB_ORIGIN: ${CIRCLE_WEB_ORIGIN:-http://localhost:3000}
      CIRCLE_LOG_LEVEL: ${CIRCLE_LOG_LEVEL:-info}
    ports:
      - "3001:3001"
    restart: unless-stopped

  # The web app builds in the same image and serves the Next.js standalone
  # output. For local development you can skip this service and run
  # `pnpm dev` on the host instead (faster iteration).
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_HOST: ${NEXT_PUBLIC_BACKEND_HOST:-http://localhost:3001}
        NEXT_PUBLIC_BASE_HOST: ${NEXT_PUBLIC_BASE_HOST:-http://localhost:3000}
    container_name: circle-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
