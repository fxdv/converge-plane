version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # eslint-config-next must match the next version.
      next:
        patterns: [next, eslint-config-next, "@next/*"]
      npm-minor-patch:
        update-types: [minor, patch]
        exclude-patterns: [next, eslint-config-next, "@next/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/server, /web]
    schedule:
      interval: weekly
    ignore:
      # Node moves between LTS lines deliberately; odd majors are not LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
